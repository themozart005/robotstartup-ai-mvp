<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Learn business and financial literacy through AI-powered robotics startup simulation" />
    <meta name="keywords" content="business education, financial literacy, AI learning, robotics, startup simulation" />
    <meta name="author" content="RoboStartup AI" />
    
    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="RoboStartup AI - Master Business Through Gaming" />
    <meta property="og:description" content="Learn business and financial literacy through AI-powered robotics startup simulation" />
    <meta property="og:url" content="https://robostartup-ai.com" />
    
    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:title" content="RoboStartup AI - Master Business Through Gaming" />
    <meta property="twitter:description" content="Learn business and financial literacy through AI-powered robotics startup simulation" />
    
    <!-- Preconnect to external domains for better performance -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    
    <!-- Favicon -->
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="manifest" href="/site.webmanifest" />
    
    <title>RoboStartup AI - Master Business Through Gaming</title>
    
    <!-- Prevent FOUC (Flash of Unstyled Content) -->
    <style>
      html {
        background: linear-gradient(135deg, #1e3a8a 0%, #7c3aed 50%, #3730a3 100%);
        min-height: 100vh;
      }
      
      /* Loading spinner for initial load */
      .loading-spinner {
        position: fixed;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        width: 40px;
        height: 40px;
        border: 4px solid rgba(255, 255, 255, 0.3);
        border-top: 4px solid #ffffff;
        border-radius: 50%;
        animation: spin 1s linear infinite;
        z-index: 9999;
      }
      
      @keyframes spin {
        0% { transform: translate(-50%, -50%) rotate(0deg); }
        100% { transform: translate(-50%, -50%) rotate(360deg); }
      }
      
      /* Hide loading spinner once React takes over */
      #root:not(:empty) + .loading-spinner {
        display: none;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    
    <!-- Loading spinner shown until React loads -->
    <div class="loading-spinner"></div>
    
    <!-- Accessibility: Screen reader announcement for app loading -->
    <div id="loading-announcement" class="sr-only" aria-live="polite">
      Loading RoboStartup AI application...
    </div>
    
    <!-- Main application script -->
    <script type="module" src="/src/main.tsx"></script>
    
    <!-- Optional: Service Worker for offline functionality -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js')
            .then((registration) => {
              console.log('SW registered: ', registration);
            })
            .catch((registrationError) => {
              console.log('SW registration failed: ', registrationError);
            });
        });
      }
    </script>
  </body>
</html>

<!-- 
EXPLANATION FOR BEGINNERS:

This HTML file is the entry point for our React application. Here's what each part does:

1. META TAGS:
   - Tell browsers and social media how to display our app
   - Improve SEO (Search Engine Optimization)
   - Set viewport for mobile responsiveness

2. PERFORMANCE OPTIMIZATIONS:
   - Preconnect to external domains
   - Favicon and app icons for different devices
   - Loading spinner to show while app loads

3. ACCESSIBILITY:
   - Screen reader announcements
   - Proper semantic HTML structure
   - Language declaration

4. PROGRESSIVE ENHANCEMENT:
   - Service worker for offline functionality
   - Graceful degradation if JavaScript fails

This ensures our app loads quickly and works well across all devices and browsers.
-->
